name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all

  duckdb-feature:
    # The store's default-off duckdb feature never compiles in the default
    # workspace build, so CI must build and test it explicitly or it rots.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p store --all-targets --features duckdb -- -D warnings
      - run: cargo test -p store --features duckdb

  release-arm64:
    # Native aarch64 build (the Raspberry Pi target) packaged as a tarball.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p sensor -p ctl -p console
      - name: package
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)
          mkdir -p dist
          cp target/release/socteam-sensor target/release/socteam target/release/socteam-console dist/
          cp deploy/socteam.toml.example dist/
          tar -czf "socteam-arm64-${VERSION}.tar.gz" -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: socteam-arm64
          path: socteam-arm64-*.tar.gz

  cross-check-aarch64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --target aarch64-unknown-linux-gnu
      # Guard the default-off contract: store must build without the
      # (C++-vendoring) duckdb feature even if the default flips later.
      - run: cargo check -p store --no-default-features --target aarch64-unknown-linux-gnu
