name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all

  duckdb-feature:
    # The store's default-off duckdb feature never compiles in the default
    # workspace build, so CI must build and test it explicitly or it rots.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p store --all-targets --features duckdb -- -D warnings
      - run: cargo test -p store --features duckdb

  release-arm64:
    # Native aarch64 build (the Raspberry Pi target) packaged as a tarball.
    # Statically linked against musl so the binaries run on any Linux
    # (Raspberry Pi OS Bookworm ships glibc 2.36; a gnu-linked binary from
    # ubuntu-24.04 needs 2.39 and dies with `GLIBC_2.39 not found`).
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release -p sensor -p ctl -p console --target aarch64-unknown-linux-musl
      - name: package
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)
          mkdir -p dist
          cp target/aarch64-unknown-linux-musl/release/socteam-sensor dist/
          cp target/aarch64-unknown-linux-musl/release/socteam dist/
          cp target/aarch64-unknown-linux-musl/release/socteam-console dist/
          cp deploy/socteam.toml.example dist/
          tar -czf "socteam-arm64-${VERSION}.tar.gz" -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: socteam-arm64
          path: socteam-arm64-*.tar.gz

  cross-check-aarch64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      # ureq's TLS stack (ring) compiles C in its build script, so the
      # cross-check needs the aarch64 gcc even for `cargo check`.
      - run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - run: cargo check --target aarch64-unknown-linux-gnu
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      # Guard the default-off contract: store must build without the
      # (C++-vendoring) duckdb feature even if the default flips later.
      - run: cargo check -p store --no-default-features --target aarch64-unknown-linux-gnu
