[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/fordaaaa/soc-team"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
strip = true

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
pnet = "0.35"
pnet_packet = "0.35"
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ctrlc = "3.4"
pcap-file = "2.0"
hickory-proto = { version = "0.24", default-features = false }
httparse = "1"
tempfile = "3"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
serde_json = "1"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
