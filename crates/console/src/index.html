<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>socteam console</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #0f151b; color: #dce6ef;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 0.6rem;
    padding: 0.9rem 1.2rem; border-bottom: 1px solid #222f3a;
  }
  header h1 { font-size: 1.1rem; margin: 0; font-weight: 600; }
  #dot {
    width: 0.7rem; height: 0.7rem; border-radius: 50%;
    background: #e0a63c; display: inline-block;
  }
  #dot.live { background: #3ddc84; }
  #mode { font-size: 0.8rem; opacity: 0.75; }
  main { padding: 1.2rem; max-width: 56rem; margin: 0 auto; }
  #meta { font-size: 0.85rem; opacity: 0.8; margin-bottom: 1rem; }
  #starting { display: none; opacity: 0.8; }
  .grid {
    display: grid; gap: 0.7rem;
    grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr));
  }
  .tile {
    background: #162029; border: 1px solid #223140;
    border-radius: 0.5rem; padding: 0.7rem 0.8rem;
  }
  .tile .label { font-size: 0.75rem; opacity: 0.7; }
  .tile .value {
    font-size: 1.35rem; font-variant-numeric: tabular-nums;
    color: #4fb3e8; margin-top: 0.15rem;
  }
  section.chart {
    margin-top: 1rem; background: #162029;
    border: 1px solid #223140; border-radius: 0.5rem; padding: 0.8rem;
  }
  section.chart h2 { font-size: 0.85rem; margin: 0 0 0.5rem; font-weight: 600; }
  canvas { width: 100%; height: 90px; display: block; }
  section.panel {
    margin-top: 1rem; background: #162029;
    border: 1px solid #223140; border-radius: 0.5rem; padding: 0.8rem;
  }
  section.panel h2 { font-size: 0.85rem; margin: 0 0 0.5rem; font-weight: 600; }
  section.panel .hint { font-size: 0.8rem; opacity: 0.6; }
  table { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
  th, td { text-align: left; padding: 0.25rem 0.4rem; white-space: nowrap; }
  th { opacity: 0.65; font-weight: 500; border-bottom: 1px solid #223140; }
  td.num { font-variant-numeric: tabular-nums; text-align: right; }
  tr:nth-child(even) td { background: rgba(255,255,255,0.02); }
  .sev { display: inline-block; padding: 0.05rem 0.45rem; border-radius: 0.6rem; font-size: 0.72rem; }
  .sev.high { background: #4a1f24; color: #ff8a93; }
  .sev.medium { background: #45361a; color: #e0a63c; }
  .sev.low { background: #1a2f45; color: #4fb3e8; }
  .alert-name { color: #4fb3e8; }
  #alerts li { list-style: none; padding: 0.3rem 0; border-bottom: 1px solid #1c2731; font-size: 0.8rem; }
  #alerts ul { margin: 0; padding: 0; }
</style>
</head>
<body>
<header>
  <span id="dot" title="connection state"></span>
  <h1>socteam console</h1>
  <span id="mode">connecting…</span>
</header>
<main>
  <div id="meta"><span id="source">—</span> · <span id="updated">—</span></div>
  <div id="starting">starting…</div>
  <div class="grid">
    <div class="tile"><div class="label">Total frames</div><div class="value" id="total">—</div></div>
    <div class="tile"><div class="label">pps</div><div class="value" id="pps">—</div></div>
    <div class="tile"><div class="label">Bytes</div><div class="value" id="bytes">—</div></div>
    <div class="tile"><div class="label">IPv4</div><div class="value" id="ipv4">—</div></div>
    <div class="tile"><div class="label">IPv6</div><div class="value" id="ipv6">—</div></div>
    <div class="tile"><div class="label">ARP</div><div class="value" id="arp">—</div></div>
    <div class="tile"><div class="label">Other</div><div class="value" id="other">—</div></div>
  </div>
  <section class="chart">
    <h2>pps (last 60 samples)</h2>
    <canvas id="spark" width="600" height="90"></canvas>
  </section>
  <section class="panel">
    <h2>Alerts</h2>
    <div class="hint" id="alerts-hint">pass --events (and optionally --alerts-file) to enable</div>
    <ul id="alerts"></ul>
  </section>
  <section class="panel">
    <h2>Recent flows</h2>
    <div class="hint" id="flows-hint">pass --events to enable</div>
    <table id="flows">
      <thead>
        <tr><th>ts</th><th>proto</th><th>state</th><th>src → dst</th><th class="num">pkts</th><th class="num">bytes</th><th class="num">dur</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>
</main>
<script>
(function () {
  "use strict";
  var samples = [];
  var dot = document.getElementById("dot");
  var mode = document.getElementById("mode");
  var pollTimer = null;

  function setLive(live) {
    dot.classList.toggle("live", live);
    mode.textContent = live ? "live" : "polling";
  }

  function draw() {
    var c = document.getElementById("spark");
    var ctx = c.getContext("2d");
    ctx.clearRect(0, 0, c.width, c.height);
    if (samples.length < 2) { return; }
    var max = Math.max.apply(null, samples.concat([1]));
    ctx.strokeStyle = "#4fb3e8";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    samples.forEach(function (v, i) {
      var x = (i / 59) * c.width;
      var y = c.height - 4 - (v / max) * (c.height - 8);
      if (i === 0) { ctx.moveTo(x, y); } else { ctx.lineTo(x, y); }
    });
    ctx.stroke();
  }

  function update(s) {
    document.getElementById("starting").style.display = "none";
    document.getElementById("total").textContent = s.total_frames;
    document.getElementById("pps").textContent = Number(s.pps).toFixed(1);
    document.getElementById("bytes").textContent = s.bytes;
    document.getElementById("ipv4").textContent = s.ipv4;
    document.getElementById("ipv6").textContent = s.ipv6;
    document.getElementById("arp").textContent = s.arp;
    document.getElementById("other").textContent = s.other;
    document.getElementById("source").textContent = s.source_kind;
    document.getElementById("updated").textContent = s.updated_at;
    samples.push(Number(s.pps) || 0);
    if (samples.length > 60) { samples.shift(); }
    draw();
  }

  function showStarting() {
    document.getElementById("starting").style.display = "block";
  }

  function poll() {
    fetch("/api/stats").then(function (r) {
      if (r.status === 503) { showStarting(); return null; }
      if (!r.ok) { return null; }
      return r.json();
    }).then(function (s) {
      if (s) { update(s); }
    }).catch(function () { /* retry on next tick */ });
  }

  function startPolling() {
    setLive(false);
    if (pollTimer === null) {
      pollTimer = setInterval(poll, 1000);
      poll();
    }
  }

  try {
    var proto = location.protocol === "https:" ? "wss://" : "ws://";
    var ws = new WebSocket(proto + location.host + "/ws");
    ws.onopen = function () {
      setLive(true);
      if (pollTimer !== null) { clearInterval(pollTimer); pollTimer = null; }
    };
    ws.onmessage = function (ev) {
      try { update(JSON.parse(ev.data)); } catch (e) { /* ignore */ }
    };
    ws.onclose = startPolling;
    ws.onerror = startPolling;
  } catch (e) {
    startPolling();
  }

  function esc(text) {
    var d = document.createElement("span");
    d.textContent = text;
    return d.innerHTML;
  }

  function renderAlerts(alerts) {
    document.getElementById("alerts-hint").style.display = "none";
    var list = document.getElementById("alerts");
    list.innerHTML = alerts.map(function (a) {
      var where = a.dst ? esc(a.src) + " → " + esc(a.dst) : esc(a.src);
      return "<li><span class='sev " + esc(a.severity) + "'>" + esc(a.severity) +
        "</span> <span class='alert-name'>" + esc(a.name) + "</span> · " + where +
        " · " + esc(a.message) + "</li>";
    }).join("");
  }

  function renderFlows(rows) {
    document.getElementById("flows-hint").style.display = "none";
    var tbody = document.querySelector("#flows tbody");
    tbody.innerHTML = rows.map(function (r) {
      var pkts = r.pkts_a_to_b + r.pkts_b_to_a;
      var bytes = r.bytes_a_to_b + r.bytes_b_to_a;
      return "<tr><td class='num'>" + r.ts.toFixed(1) + "</td><td>" + esc(r.proto) +
        "</td><td>" + esc(r.conn_state) + "</td><td>" + esc(r.src) + ":" +
        (r.src_port === null ? "-" : r.src_port) + " → " + esc(r.dst) + ":" +
        (r.dst_port === null ? "-" : r.dst_port) + "</td><td class='num'>" + pkts +
        "</td><td class='num'>" + bytes + "</td><td class='num'>" +
        r.duration.toFixed(2) + "s</td></tr>";
    }).join("");
  }

  function disable(hintId) {
    var hint = document.getElementById(hintId);
    if (hint) { hint.style.display = ""; }
  }

  function fetchViews() {
    fetch("/api/alerts").then(function (r) {
      if (!r.ok) { disable("alerts-hint"); return null; }
      return r.json();
    }).then(function (a) {
      if (a && a.length > 0) { renderAlerts(a); }
    }).catch(function () { /* retry next round */ });
    fetch("/api/flows").then(function (r) {
      if (!r.ok) { disable("flows-hint"); return null; }
      return r.json();
    }).then(function (rows) {
      if (rows && rows.length > 0) { renderFlows(rows); }
    }).catch(function () { /* retry next round */ });
  }
  setInterval(fetchViews, 2000);
  fetchViews();
})();
</script>
</body>
</html>
