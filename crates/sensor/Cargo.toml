[package]
name = "sensor"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Passive network sensor: packet capture, protocol parsing, flow table, NDJSON events"

[[bin]]
name = "socteam-sensor"
path = "src/main.rs"

[lib]
name = "sensor"
path = "src/lib.rs"

[dependencies]
pnet.workspace = true
pnet_packet.workspace = true
clap.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ctrlc.workspace = true
pcap-file.workspace = true
hickory-proto.workspace = true
httparse.workspace = true
detect = { path = "../detect" }
events = { path = "../events" }
serde.workspace = true
toml.workspace = true
serde_json.workspace = true

[[bench]]
name = "parse"
harness = false

[dev-dependencies]
criterion = "0.7"
tempfile.workspace = true

[lints]
workspace = true
